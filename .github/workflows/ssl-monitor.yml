name: MXK8 SSL Certificate Monitor

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email to tim@mxk8.com if no certificate alerts are found"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ssl-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check certificates and send alerts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: tim@mxk8.com
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: python monitor.py
